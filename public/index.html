<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema Lojas Variara</title>
    <link rel="stylesheet" href="/css/global-style.css">
    <script src="/js/utils/empresa-carregamento-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="root">
        <div id="lv-initial-page-loader" class="ui-cg ui-cg--pagina" role="status" aria-live="polite" aria-label="Carregando" style="--ui-cg-empresa-cor:#2563eb;--ui-cg-empresa-contraste:#ffffff;">
            <div class="ui-cg-spinner ui-cg-spinner--lg">
                <span class="ui-cg-nucleo-halo" aria-hidden="true"></span>
                <span class="ui-cg-orbita ui-cg-orbita--interna" aria-hidden="true"><i class="ui-cg-no ui-cg-no--a"></i><i class="ui-cg-no ui-cg-no--b"></i></span>
                <span class="ui-cg-orbita ui-cg-orbita--externa" aria-hidden="true"><i class="ui-cg-no ui-cg-no--c"></i></span>
                <span class="ui-cg-nucleo-marca" aria-hidden="true">LV</span>
            </div>
            <span class="ui-cg-etapas" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="ui-cg-texto">Organizando seu ambiente...</span>
        </div>
    </div>
    <script type="module" src="/src/main-login.tsx"></script>
</body>
</html>
