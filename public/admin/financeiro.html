<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro</title>
    <link rel="stylesheet" href="/css/global-style.css">
    <link rel="stylesheet" href="/css/menu-lateral.css">
    <link rel="stylesheet" href="/css/financeiro.css">
    <link rel="stylesheet" href="/css/financeiro-compositor.css">
    <link rel="stylesheet" href="/css/popups.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <script>
        try {
            if (sessionStorage.getItem('lv_transicao_empresa')) {
                document.documentElement.classList.add('ml-transition-bootstrap');
            }
        } catch {
            // O carregamento normal continua caso o storage esteja indisponível.
        }
    </script>
</head>
<body>
    <div
        id="ml-transition-bootstrap-overlay"
        class="ml-transition-overlay ml-transition-bootstrap-overlay is-recarregando"
        role="status"
        aria-live="polite"
        aria-busy="true"
        hidden
    >
        <div class="ml-transition-ambient is-origin" aria-hidden="true"></div>
        <div class="ml-transition-ambient is-destination" aria-hidden="true"></div>

        <div class="ml-transition-content">
            <span class="ml-transition-kicker">
                <i class="fa-solid fa-building-circle-arrow-right" aria-hidden="true"></i>
                Contexto atualizado
            </span>

            <div class="ml-transition-route">
                <div class="ml-transition-company">
                    <span class="ml-transition-company-brand" data-bootstrap-brand="origem" aria-hidden="true"></span>
                    <span class="ml-transition-company-copy">
                        <small>Empresa atual</small>
                        <strong data-bootstrap-nome="origem"></strong>
                    </span>
                </div>

                <span class="ml-transition-stitch" aria-hidden="true">
                    <svg viewBox="0 0 260 58" preserveAspectRatio="none">
                        <path d="M8 29 C66 3 194 55 252 29"></path>
                        <path class="is-thread" d="M8 29 C66 3 194 55 252 29"></path>
                    </svg>
                    <i class="fa-solid fa-arrow-right ml-transition-needle"></i>
                </span>

                <div class="ml-transition-company is-destination">
                    <span class="ml-transition-company-brand" data-bootstrap-brand="destino" aria-hidden="true"></span>
                    <span class="ml-transition-company-copy">
                        <small>Novo ambiente</small>
                        <strong data-bootstrap-nome="destino"></strong>
                    </span>
                    <span class="ml-transition-ready" aria-hidden="true">
                        <i class="fa-solid fa-check"></i>
                    </span>
                </div>
            </div>

            <div class="ml-transition-message">
                <strong>Contexto atualizado</strong>
                <span>Abrindo o novo ambiente…</span>
            </div>

            <span class="ml-transition-progress" aria-hidden="true"><span></span></span>
        </div>
    </div>

    <script>
        (() => {
            const overlay = document.getElementById('ml-transition-bootstrap-overlay');
            const nomeEmpresa = (empresa) =>
                empresa?.nome_fantasia || empresa?.razao_social || 'Empresa';
            const iniciaisEmpresa = (empresa) =>
                nomeEmpresa(empresa)
                    .split(/\s+/)
                    .filter(Boolean)
                    .slice(0, 2)
                    .map((parte) => parte[0])
                    .join('')
                    .toUpperCase();

            try {
                const transicao = JSON.parse(sessionStorage.getItem('lv_transicao_empresa') || 'null');
                if (!transicao?.origem?.id || !transicao?.destino?.id) {
                    document.documentElement.classList.remove('ml-transition-bootstrap');
                    return;
                }

                ['origem', 'destino'].forEach((tipo) => {
                    const empresa = transicao[tipo];
                    const marca = overlay.querySelector(`[data-bootstrap-brand="${tipo}"]`);
                    const nome = overlay.querySelector(`[data-bootstrap-nome="${tipo}"]`);
                    marca.textContent = iniciaisEmpresa(empresa);
                    marca.style.setProperty(
                        '--ml-transition-company-color',
                        empresa.cor_identificacao || '#2563eb',
                    );
                    nome.textContent = nomeEmpresa(empresa);
                });

                overlay.setAttribute(
                    'aria-label',
                    `Abrindo o ambiente ${nomeEmpresa(transicao.destino)}.`,
                );
                overlay.hidden = false;
            } catch {
                document.documentElement.classList.remove('ml-transition-bootstrap');
            }
        })();
    </script>

    <main id="root" class="gs-card"></main>

    <script src="/src/main-menu-lateral.tsx" type="module"></script>
    <script type="module" src="/src/main-financeiro.tsx"></script>
</body>
</html>
