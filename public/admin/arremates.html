<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arremates</title>
    <link rel="stylesheet" href="/css/global-style.css">
    <script src="/js/utils/empresa-carregamento-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/menu-lateral.css">
    <link rel="stylesheet" href="/css/arremates.css">
    <link rel="stylesheet" href="/css/popups.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="carregamentoGlobal" class="gs-carregamento-global-container visivel">
        <div class="ui-cg ui-cg--bloco" role="status" aria-live="polite" aria-label="Carregando" style="--ui-cg-empresa-cor:#2563eb;--ui-cg-empresa-contraste:#ffffff;">
            <div class="ui-cg-spinner ui-cg-spinner--lg"><span class="ui-cg-nucleo-halo" aria-hidden="true"></span><span class="ui-cg-orbita ui-cg-orbita--interna" aria-hidden="true"><i class="ui-cg-no ui-cg-no--a"></i><i class="ui-cg-no ui-cg-no--b"></i></span><span class="ui-cg-orbita ui-cg-orbita--externa" aria-hidden="true"><i class="ui-cg-no ui-cg-no--c"></i></span><span class="ui-cg-nucleo-marca" aria-hidden="true">LV</span></div>
            <span class="ui-cg-etapas" aria-hidden="true"><i></i><i></i><i></i></span><span class="ui-cg-texto">Organizando seu ambiente...</span>
        </div>
    </div>
    <div class="hamburger-menu">
        <i class="fas fa-bars"></i>
        <i class="fas fa-times"></i>
    </div>

    <main id="root" class="gs-card"></main>

    <!-- MODAL "MODO FOCO" (fora do main para z-index correto) -->
    <!-- Histórico Geral de Arremates agora é ArremateHistoricoModal.jsx (React) -->
    <div id="modalModoFoco" class="popup-container" style="display: none;">
        <div class="popup-overlay"></div>
        <div class="oa-modal-foco">
            <div class="oa-modal-header">
                <div class="header-info-foco">
                    <img id="focoAvatar" src="/img/placeholder-image.png" alt="Avatar" class="avatar-tiktik">
                    <h3 id="focoTitulo" class="oa-modal-titulo">Desempenho Hoje</h3>
                </div>
                <button class="oa-modal-fechar-btn">X</button>
            </div>

            <div class="oa-modal-body-foco">
                <div id="focoMetricas" class="foco-metricas-grid"></div>

                <h4>Resumo do Dia por Produto</h4>
                <div id="focoResumoProdutos" class="foco-resumo-container">
                    <div class="ui-cg ui-cg--bloco" role="status" aria-live="polite" aria-label="Calculando resumo" style="--ui-cg-empresa-cor:#2563eb;--ui-cg-empresa-contraste:#ffffff;"><div class="ui-cg-spinner ui-cg-spinner--sm"><span class="ui-cg-nucleo-halo" aria-hidden="true"></span><span class="ui-cg-orbita ui-cg-orbita--interna" aria-hidden="true"><i class="ui-cg-no ui-cg-no--a"></i><i class="ui-cg-no ui-cg-no--b"></i></span><span class="ui-cg-orbita ui-cg-orbita--externa" aria-hidden="true"><i class="ui-cg-no ui-cg-no--c"></i></span><span class="ui-cg-nucleo-marca" aria-hidden="true">LV</span></div><span class="ui-cg-texto">Calculando resumo...</span></div>
                </div>

                <h4>Tarefas Finalizadas Hoje</h4>
                <div id="focoTarefas" class="oa-tabela-wrapper"></div>
            </div>
        </div>
    </div>

    <script src="/src/main-menu-lateral.tsx" type="module"></script>
    <script src="/js/admin-arremates.js" type="module"></script>
    <script src="/src/main-arremates.jsx" type="module"></script>
</body>
</html>
